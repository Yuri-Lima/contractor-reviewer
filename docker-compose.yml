services:
  postgres:
    image: pgvector/pgvector:pg18
    # platform: linux/amd64
    container_name: contractai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractai}
      POSTGRES_DB: ${POSTGRES_DB:-contractai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractai} -d ${POSTGRES_DB:-contractai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: contractai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@contractai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_PGPASS_LINE: "postgres:5432:*:${POSTGRES_USER:-contractai}:${POSTGRES_PASSWORD:-contractai}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s\n' "$$PGADMIN_PGPASS_LINE" > /var/lib/pgadmin/pgpass && \
        chmod 600 /var/lib/pgadmin/pgpass && \
        exec /entrypoint.sh
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # platform: linux/amd64
    container_name: contractai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  docling:
    build:
      context: ./services/docling
      # platform: linux/amd64
    # platform: linux/amd64
    container_name: contractai-docling
    ports:
      - "${DOCLING_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pdfplumber:
    build:
      context: ./services/pdfplumber
      # platform: linux/amd64
    # platform: linux/amd64
    container_name: contractai-pdfplumber
    ports:
      - "${PDFPLUMBER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
