# ContractAI Review — VPS deployment (image-only, no build)
# Usage on VPS: Copy this file and deploy/.env.example, create .env, then:
#   docker compose up -d
# Images pulled from Docker Hub. DOCKERHUB_USERNAME defaults to yurimatoslima.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-contractai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractai} -d ${POSTGRES_DB:-contractai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contractai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  docling:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-docling:${IMAGE_TAG:-latest}
    container_name: contractai-docling
    ports:
      - "${DOCLING_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pdfplumber:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-pdfplumber:${IMAGE_TAG:-latest}
    container_name: contractai-pdfplumber
    ports:
      - "${PDFPLUMBER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-api:${IMAGE_TAG:-latest}
    container_name: contractai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contractai}
      REDIS_URL: redis://redis:6379
      DOCLING_URL: http://docling:8000
      PDFPLUMBER_URL: http://pdfplumber:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/apps/api/storage}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SUPERADMIN_ENABLED: ${SUPERADMIN_ENABLED:-true}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@contractai.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      PARSER_KEYS_ENCRYPTION_KEY: ${PARSER_KEYS_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-contractai}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - api_storage:/app/apps/api/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-api:${IMAGE_TAG:-latest}
    container_name: contractai-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contractai}
      REDIS_URL: redis://redis:6379
      DOCLING_URL: http://docling:8000
      PDFPLUMBER_URL: http://pdfplumber:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/apps/api/storage}
      PARSER_KEYS_ENCRYPTION_KEY: ${PARSER_KEYS_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-contractai}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - api_storage:/app/apps/api/storage

  web:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-web:${IMAGE_TAG:-latest}
    container_name: contractai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  api_storage:
