# ContractAI Review — Production Nginx config (Docker)
# Multi-instance API support, security hardening, performance tuning
# Included from http {} — resolver and upstream are http-level

# Docker embedded DNS — re-resolve every 10s for scaled API replicas
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# JSON log format for production (optional — uncomment access_log to use)
log_format json_combined escape=json '{ "time": "$time_iso8601", "remote_addr": "$remote_addr", "request": "$request", "status": $status, "body_bytes": $body_bytes_sent, "referer": "$http_referer", "ua": "$http_user_agent", "request_time": $request_time }';

# Upstream for API — load balance across scaled replicas, connection pooling
# zone required for resolve (dynamic DNS re-resolution across workers)
upstream api_backend {
    zone api_backend 64k;
    server api:3000 max_fails=3 fail_timeout=30s resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Client limits — match API upload validator (25MB)
    client_max_body_size 25M;
    client_body_buffer_size 128k;
    client_body_timeout 60s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'" always;

    # API proxy — forward /api to backend (load balanced across replicas)
    location /api {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JSON access log for production (optional, uncomment to enable)
    # access_log /var/log/nginx/access.log json_combined;
}
