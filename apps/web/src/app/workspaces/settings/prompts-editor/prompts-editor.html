<div class="prompts-editor p-4">
  <p-message
    severity="info"
    [text]="'prompts.workspaceDescription' | translate"
    class="mb-6"
  ></p-message>

  <div class="mb-6 space-y-4">
    <div class="flex items-center justify-between gap-4">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
        {{ 'prompts.includeGlobal' | translate }}
      </label>
      <p-toggleswitch
        [ngModel]="includeGlobal()"
        (ngModelChange)="onScopeToggle('includeGlobal', $event)"
        [disabled]="savingScope()"
      ></p-toggleswitch>
    </div>
    <div class="flex items-center justify-between gap-4">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
        {{ 'prompts.includeWorkspace' | translate }}
      </label>
      <p-toggleswitch
        [ngModel]="includeWorkspace()"
        (ngModelChange)="onScopeToggle('includeWorkspace', $event)"
        [disabled]="savingScope()"
      ></p-toggleswitch>
    </div>
  </div>

  @if (loading()) {
    <p class="text-gray-600 dark:text-gray-400">{{ 'common.loading' | translate }}</p>
  } @else {
    <div class="space-y-4">
      <small class="text-gray-500 dark:text-gray-400 block">
        {{ 'prompts.templateVariablesHint' | translate }}
      </small>
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300 block">
        {{ labelKey | translate }}
      </label>
      <textarea
        pTextarea
        [ngModel]="editedContent()"
        (ngModelChange)="onContentChange($event)"
        rows="10"
        [autoResize]="true"
        class="w-full font-mono text-sm"
      ></textarea>
      <div class="flex gap-2 justify-end">
        @if (prompt()?.source === 'workspace') {
          <p-button
            [label]="'prompts.resetToDefault' | translate"
            icon="pi pi-refresh"
            severity="secondary"
            [outlined]="true"
            [loading]="saving()"
            [disabled]="saving()"
            (onClick)="onReset()"
            [pTooltip]="'prompts.resetToDefault' | translate"
          ></p-button>
        }
        <p-button
          [label]="'prompts.save' | translate"
          icon="pi pi-check"
          [loading]="saving()"
          [disabled]="!hasChanges() || saving()"
          (onClick)="onSave()"
          [pTooltip]="'common.save' | translate"
        ></p-button>
      </div>
    </div>
  }
</div>
