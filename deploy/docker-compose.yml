# ContractAI Review — VPS deployment (image-only, no build)
# Usage on VPS: Copy this file and deploy/.env.example, create .env, then:
#   docker compose up -d
# Images pulled from Docker Hub. DOCKERHUB_USERNAME defaults to yurimatoslima.
# Traefik handles TLS termination, Let's Encrypt, and HTTP→HTTPS redirect.

services:
  traefik:
    image: traefik:v3.6
    platform: linux/amd64
    container_name: contractai-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_acme:/etc/traefik/acme
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=contractai-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    networks:
      - contractai

  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    container_name: contractai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-contractai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractai} -d ${POSTGRES_DB:-contractai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contractai

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: contractai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - contractai

  docling:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-docling:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: contractai-docling
    ports:
      - "${DOCLING_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - contractai

  pdfplumber:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-pdfplumber:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: contractai-pdfplumber
    ports:
      - "${PDFPLUMBER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - contractai

  api:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: contractai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling:
        condition: service_healthy
      pdfplumber:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contractai}
      REDIS_URL: redis://redis:6379
      DOCLING_URL: http://docling:8000
      PDFPLUMBER_URL: http://pdfplumber:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/apps/api/storage}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SUPERADMIN_ENABLED: ${SUPERADMIN_ENABLED:-true}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@contractai.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      PARSER_KEYS_ENCRYPTION_KEY: ${PARSER_KEYS_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-contractai}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - api_storage:/app/apps/api/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - contractai

  worker:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: contractai-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling:
        condition: service_healthy
      pdfplumber:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contractai}
      REDIS_URL: redis://redis:6379
      DOCLING_URL: http://docling:8000
      PDFPLUMBER_URL: http://pdfplumber:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/apps/api/storage}
      PARSER_KEYS_ENCRYPTION_KEY: ${PARSER_KEYS_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-contractai}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - api_storage:/app/apps/api/storage
    networks:
      - contractai

  web:
    image: ${DOCKERHUB_USERNAME:-yurimatoslima}/contractai-web:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: contractai-web
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_started
      api:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.contractai-web-https.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.contractai-web-https.entrypoints=websecure"
      - "traefik.http.routers.contractai-web-https.tls=true"
      - "traefik.http.routers.contractai-web-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.contractai-web-https.service=contractai-web-svc"
      - "traefik.http.routers.contractai-web-http.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.contractai-web-http.entrypoints=web"
      - "traefik.http.routers.contractai-web-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      # Local verification: allow localhost for scripts (no HTTPS redirect)
      - "traefik.http.routers.contractai-web-local.rule=Host(`localhost`)"
      - "traefik.http.routers.contractai-web-local.entrypoints=web"
      - "traefik.http.routers.contractai-web-local.service=contractai-web-svc"
      - "traefik.http.routers.contractai-web-local.priority=1"
      - "traefik.http.services.contractai-web-svc.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - contractai

volumes:
  postgres_data:
  redis_data:
  api_storage:
  traefik_acme:

networks:
  contractai:
    name: contractai-network
