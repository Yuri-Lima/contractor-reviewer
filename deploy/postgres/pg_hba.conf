# ContractAI Review — Production pg_hba.conf
# Restricts connections to Docker network and localhost only.
# No 0.0.0.0/0 — blocks external scanners when port is bound to 127.0.0.1.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
