# ContractAI Review — Production overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: contractai-api:latest
    container_name: contractai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contractai}
      REDIS_URL: redis://redis:6379
      DOCLING_URL: http://docling:8000
      PDFPLUMBER_URL: http://pdfplumber:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/apps/api/storage}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SUPERADMIN_ENABLED: ${SUPERADMIN_ENABLED:-true}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@contractai.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      PARSER_KEYS_ENCRYPTION_KEY: ${PARSER_KEYS_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-contractai}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - api_storage:/app/apps/api/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: contractai-api:latest
    container_name: contractai-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-contractai}
      REDIS_URL: redis://redis:6379
      DOCLING_URL: http://docling:8000
      PDFPLUMBER_URL: http://pdfplumber:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/apps/api/storage}
      PARSER_KEYS_ENCRYPTION_KEY: ${PARSER_KEYS_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-contractai}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - api_storage:/app/apps/api/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: contractai-web:latest
    container_name: contractai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  api_storage:
