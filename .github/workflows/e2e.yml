name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager" (pnpm@9.0.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package (required by api/web typecheck)
        run: pnpm --filter @contractai-review/shared build

      - name: Lint, test, and build
        run: pnpm nx run-many -t lint test build -p api,web,@contractai-review/shared

  e2e:
    needs: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version comes from package.json "packageManager" (pnpm@9.0.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @contractai-review/shared build

      - name: Start Postgres and Redis
        # GitHub-hosted runners ship Docker Compose V2 as `docker compose`
        run: docker compose up -d postgres redis

      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            if docker exec contractai-postgres pg_isready -U contractai -d contractai; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to become ready"
          docker compose ps
          docker compose logs postgres || true
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if docker exec contractai-redis redis-cli ping | grep -q PONG; then
              echo "Redis ready"
              exit 0
            fi
            sleep 1
          done
          echo "Redis failed to become ready"
          exit 1

      - name: Run migrations
        run: pnpm migration:run
        env:
          DATABASE_URL: postgresql://contractai:contractai@localhost:5432/contractai
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: E2E_WITH_API=1 ./scripts/e2e.sh
        env:
          CI: true
          DATABASE_URL: postgresql://contractai:contractai@localhost:5432/contractai
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          E2E_TEST_EMAIL: e2e-test@example.com
          E2E_TEST_PASSWORD: password123
          # Ensure TypeORM never syncs in CI
          NODE_ENV: test
          TYPEORM_SYNCHRONIZE: 'false'
