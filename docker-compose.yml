services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractai}
      POSTGRES_DB: ${POSTGRES_DB:-contractai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractai} -d ${POSTGRES_DB:-contractai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contractai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  docling:
    build: ./services/docling
    container_name: contractai-docling
    ports:
      - "${DOCLING_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pdfplumber:
    build: ./services/pdfplumber
    container_name: contractai-pdfplumber
    ports:
      - "${PDFPLUMBER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
