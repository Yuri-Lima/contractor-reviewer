sections:
  - id: fixed-term-2003-s8-renewal
    section: "Section 8 — Objective grounds for renewal"
    text: |
      Where an employer proposes to renew a fixed-term contract, they must
      inform the employee in writing, no later than the date of renewal, of
      the objective grounds justifying the renewal and the failure to offer a
      contract of indefinite duration. Failure to do so may be relied upon by
      the employee in any subsequent CID claim before the WRC.

  - id: fixed-term-2003-s9-cid
    section: "Section 9 — Successive fixed-term contracts (CID)"
    text: |
      Where an employee has been on two or more continuous fixed-term
      contracts the aggregate duration of which exceeds 4 years, the contract
      shall be deemed to be one of indefinite duration UNLESS there are
      objective grounds justifying renewal on a fixed-term basis.
