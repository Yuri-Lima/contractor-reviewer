services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractai}
      POSTGRES_DB: ${POSTGRES_DB:-contractai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractai} -d ${POSTGRES_DB:-contractai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contractai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
